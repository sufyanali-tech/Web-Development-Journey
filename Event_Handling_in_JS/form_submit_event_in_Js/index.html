        .card {
            margin-top: 50px;
            padding: 20px;
            border: 1px solid #555;
            background-color: rgb(44, 43, 43);
            display: inline-block;
            border-radius: 10px;
            max-width: 300px;
            color: white;
        }
        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden; /* Remove extra cover of the image*/
        }
        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card p {
            margin-top: 10px;
            font-size: 12px;
        }
        .card h5 {
            margin-top: 3px;
        }
