<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding : 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: "Urbanist";
        }

        #main {

            width: 100%;
            height: 100vh;
            background-color: rgb(44, 43, 43);
            display: grid;
            place-items: center;
        }
        input {
            display: none;
        }
        #btn {
            padding: 10px 20px;
            color: white;
            background-color: rgb(59, 124, 68);
            border-radius: 10px;
            font-weight: 500;
        }
        #btn:hover {

            background-color: rgb(58, 88, 58);
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="fileinput" type="file">
        <div id="btn">
            Upload File
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
